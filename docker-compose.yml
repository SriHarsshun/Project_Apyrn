version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: willofd01
      POSTGRES_DB: project_apyrn
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:willofd01@postgres:5432/project_apyrn
      JWT_SECRET: ${JWT_SECRET:-super_secret_dev_key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOW_STOCK_THRESHOLD: 10
      PORT: 3000
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
